---
layout: default
---
<article class="post container prose">
  <header class="post-header">
    <p class="eyebrow">{{ page.categories | join: ' · ' }}</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y/%m/%d" }} · {{ page.reading_time | default: "چند دقیقه مطالعه" }}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">← بازگشت به نوشته‌ها</a>
</article>
